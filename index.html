  $('#fti').value=a?a.title:'';$('#fn').value=a?a.notes||'':'';$('#wat').value='';$('#wast').textContent='';$('#ferr').textContent='';$('#wab').classList.remove('open');
  fFile=null;fRemove=false;fOld=a&&a.pdfId?{id:a.pdfId,n:a.pdfN,name:a.pdfName}:null;rPdf();rSubj();rCal();
  $('#fdl').hidden=!a;$('#fdl').textContent='Delete';show()}
function openExam(x){mode='exam';$('#fm').classList.add('ex');edit=x||null;$('#fh').textContent=x?'Edit exam':'New exam';$('#dl').textContent='Exam date';
  fSub=x?x.subject:SUBJ[0];fDate=x?pKey(x.date):null;const cm=fDate||new Date();calM=new Date(cm.getFullYear(),cm.getMonth(),1);
  $('#xs').value=x?x.s:'10:00';$('#xe').value=x?x.e:'11:00';$('#ferr').textContent='';rSubj();rCal();$('#fdl').hidden=!x;$('#fdl').textContent='Delete';show()}
const closeSheet=()=>{$('#ov').classList.remove('on');if(hist){hist=false;try{history.back()}catch(e){}}};
addEventListener('popstate',()=>{$('#ov').classList.remove('on');hist=false});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
async function openPdf(a,btn){
  const dc=isDoc(a.pdfName),mime=dc?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'application/pdf';
  const go=u=>{if(dc){const l=document.createElement('a');l.href=u;l.download=a.pdfName||'file.docx';document.body.appendChild(l);l.click();l.remove()}else window.open(u,'_blank')};
  if(PB[a.pdfId]){go(PB[a.pdfId]);return}
  const w=dc?null:window.open('','_blank'),old=btn.textContent;btn.textContent='Loading...';
  try{const b=await store.getPdf(a.pdfId,a.pdfN),bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    PB[a.pdfId]=URL.createObjectURL(new Blob([u],{type:mime}));btn.textContent=old;
    if(dc)go(PB[a.pdfId]);else if(w)w.location.href=PB[a.pdfId];else btn.textContent='Tap again to open'}
  catch(x){if(w)w.close();btn.textContent='Could not load'}}

/* ---------- WhatsApp message parser ---------- */
const AL={Maths:['maths?','mathematics'],Chemistry:['chem','chemistry'],PPS:['pps','programming'],IIKS:['iiks','iks','indian knowledge'],EM:['em','engineering mechanics','mechanics'],PS:['ps','ps-?i','practice session'],EW:['ew','elec ws','electrical workshop','workshop']};
const MA=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'],MR='(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
function parseWA(x){
  const c=x.replace(/^\[[^\]\n]*\][^:\n]*:\s*/gm,'').replace(/^\d{1,2}\/\d{1,2}\/\d{2,4},?\s*[\d:]+\s*(?:am|pm)?\s*-\s*[^:\n]*:\s*/gim,'').trim(),l=c.toLowerCase(),o={n:c};
  for(const s in AL)if(new RegExp('\\b('+AL[s].join('|')+')\\b').test(l)){o.s=s;break}
  o.t=/innovative/.test(l)?'Innovative exam':/experiment|practical|\blab\b|journal|write-?up|viva/.test(l)?'Experiment':'Assignment';
  const t0=new Date();t0.setHours(0,0,0,0);let d=null,m;
  const fix=(dd,mm,yy)=>{if(mm<0||mm>11||dd<1||dd>31)return null;const y=yy?(+yy<100?2000+ +yy:+yy):t0.getFullYear();let r=new Date(y,mm,dd);if(!yy&&r<new Date(t0.getTime()-30*864e5))r=new Date(y+1,mm,dd);return r};
  if(m=l.match(new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?[\\s-]*'+MR+'\\b(?:[\\s,-]*(\\d{4}))?')))d=fix(+m[1],MA.indexOf(m[2].slice(0,3)),m[3]);
  else if(m=l.match(new RegExp('\\b'+MR+'\\s*(\\d{1,2})(?:st|nd|rd|th)?\\b')))d=fix(+m[2],MA.indexOf(m[1].slice(0,3)));
  else if(m=l.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/))d=fix(+m[1],+m[2]-1,m[3]);
  else if(/\btoday\b/.test(l))d=t0;
  else if(/\b(tomorrow|tmrw)\b/.test(l)){d=new Date(t0);d.setDate(d.getDate()+1)}
  else if(m=l.match(/\b(sun|mon|tues?|wed(?:nes)?|thu(?:rs?)?|fri|sat(?:ur)?)(?:day)?\b/)){d=new Date(t0);const k=(['sun','mon','tue','wed','thu','fri','sat'].indexOf(m[1].slice(0,3))-d.getDay()+7)%7;d.setDate(d.getDate()+(k||7))}
  const bm=l.match(/batch\s*-?\s*([123])/);o.b=bm?+bm[1]:0;o.d=d;o.title=(c.split('\n').find(s=>s.trim())||'').trim().slice(0,70);
  return o}

/* ---------- batch chooser ---------- */
function rBatch(){$('#bh').textContent='Batch '+(batch||1)}
function openBatch(){$('#bsg').innerHTML=[1,2,3].map(n=>`<button type="button" class="sc${n===batch?' on':''}" style="--h:${[205,145,345][n-1]}" data-b="${n}"><i></i>Batch ${n}</button>`).join('');$('#ov3').classList.add('on')}
$('#bsg').onclick=e=>{const b=e.target.closest('button');if(!b)return;batch=+b.dataset.b;sv('batch',batch);T=TB[batch];eb=batch;hh='';tab=null;$('#ov3').classList.remove('on');rBatch();rTT();rAS();tick()};
$('#bch').onclick=openBatch;$('#ov3').onclick=e=>{if(e.target.id==='ov3'&&batch)$('#ov3').classList.remove('on')};
$('#ebp').onclick=e=>{const n=e.target.dataset.eb;if(n){eb=+n;rAS()}};
$('#bp').onclick=e=>{const n=e.target.dataset.bp;if(n){fBatch=+n;rBP()}};

/* ---------- events ---------- */
$('#tgl').onclick=e=>e.currentTarget.classList.toggle('open');
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(t){tab=+t;rTT()}};
$('#tt').onclick=e=>{const q=e.target.dataset;
  if(q.c){const c=[...OV.can],i=c.indexOf(q.c);i<0?c.push(q.c):c.splice(i,1);OV={...OV,can:c};store.setOv(OV);rTT();tick()}
  if(q.h){const c=[...OV.hol],i=c.indexOf(q.h);i<0?c.push(q.h):c.splice(i,1);OV={...OV,hol:c};store.setOv(OV);rTT();tick()}};
function exClick(e){const q=e.target.dataset;if(q.xa)openExam();else if(q.xi)importEx();else if(q.x)openExam(X.find(x=>x.id===q.x))}
$('#tt').addEventListener('click',exClick);$('#s-ex').addEventListener('click',exClick);
$('#flt').onclick=e=>{const f=e.target.dataset.f;if(f){filter=f;anim=true;[...$('#flt').children].forEach(b=>b.classList.toggle('on',b.dataset.f===f));rAS()}};
$('#as').onclick=e=>{const q=e.target.dataset;
  if(q.d){done=done.includes(q.d)?done.filter(x=>x!==q.d):[...done,q.d];sv('done',done);rAS()}
  else if(q.e)openSheet(A.find(a=>a.id===q.e));
  else if(q.p)openPdf(A.find(a=>a.id===q.p),e.target);
  else if(q.n)e.target.classList.toggle('open')};
$('#ft').onclick=e=>{if(e.target.id==='si')store.signIn();if(e.target.id==='so')store.signOut()};
$('#ft').onchange=e=>{if(e.target.id==='pt'||e.target.id==='pd'){demo=($('#pt')||{}).value||null;demoD=($('#pd')||{}).value||null;lastMin='';rTT();rEX();tick()}};
$('#xs').innerHTML=$('#xe').innerHTML=(()=>{let o='';for(let m=420;m<=1260;m+=15){const t=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');o+=`<option value="${t}">${f12(t)}</option>`}return o})();
$('#tp').onclick=e=>{const b=e.target.closest('button');if(b){type=b.dataset.t;setType()}};
$('#sg').onclick=e=>{const b=e.target.closest('button');if(b){fSub=b.dataset.s;rSubj()}};
$('#cal').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.m)calM=new Date(calM.getFullYear(),calM.getMonth()+ +b.dataset.m,1);else if(b.dataset.day){fDate=new Date(calM.getFullYear(),calM.getMonth(),+b.dataset.day);$('#ferr').textContent=''}rCal()};
$('#qk').onclick=e=>{const b=e.target.closest('button');if(b){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+ +b.dataset.q);fDate=d;calM=new Date(d.getFullYear(),d.getMonth(),1);$('#ferr').textContent='';rCal()}};
$('#wab').onclick=e=>e.currentTarget.classList.toggle('open');
$('#wago').onclick=()=>{const r=parseWA($('#wat').value);if(!r.n){$('#wast').textContent='Paste a message first.';return}
  if(r.s)fSub=r.s;type=r.t;if(r.b)fBatch=r.b;if(!isAdmin()){type='Experiment';fBatch=brOf()}setType();rBP();if(r.d){fDate=r.d;calM=new Date(r.d.getFullYear(),r.d.getMonth(),1);$('#ferr').textContent=''}
  $('#fti').value=r.title;$('#fn').value=r.n;rSubj();rCal();
  $('#wast').textContent='Filled'+(r.s?' \u00b7 '+r.s:' \u00b7 pick subject')+(r.d?' \u00b7 '+r.d.toLocaleDateString([],{day:'numeric',month:'short'}):' \u00b7 pick date')+'. Please check.'};
$('#pk').onclick=()=>$('#pdf').click();
$('#pdf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!/\.(pdf|docx)$/i.test(f.name)){$('#ferr').textContent='Only PDF or DOCX files are allowed.';return}
  if(f.size>1048576){$('#ferr').textContent='File is too large (max 1 MB). Compress it and try again.';return}
  $('#ferr').textContent='';fFile=f;rPdf()};
$('#px').onclick=()=>{fFile=null;fRemove=true;rPdf()};
$('#add').onclick=()=>openSheet();$('#fx').onclick=closeSheet;$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};
$('#fdl').onclick=async e=>{if(e.target.textContent==='Delete'){e.target.textContent='Tap again to confirm';return}
  try{if(mode==='exam')await store.delExam(edit.id);else{await store.del(edit.id);if(edit.pdfId)await store.delPdf(edit.pdfId,edit.pdfN)}closeSheet()}catch(x){alert('Could not delete. Are you signed in as an admin?')}};
$('#fm').onsubmit=async e=>{e.preventDefault();
  if(!fDate){$('#ferr').textContent='Pick a date.';return}
  if(mode==='exam'){const s=$('#xs').value,en=$('#xe').value;if(en<=s){$('#ferr').textContent='End time must be after start time.';return}
    const r={subject:fSub,date:ds(fDate),s,e:en};if(edit)r.id=edit.id;
    try{await store.saveExam(r);closeSheet()}catch(x){alert('Could not save. Are you signed in as an admin?')}return}
  if(type==='Experiment'&&!fBatch){$('#ferr').textContent='Choose the batch for this experiment.';return}
  const r={type,subject:fSub,title:$('#fti').value.trim(),due:dueTs(),notes:$('#fn').value.trim(),batch:type==='Experiment'?fBatch:0};if(edit)r.id=edit.id;
  if(!r.title){if(type==='Innovative exam')r.title=fSub+' innovative exam';else{$('#ferr').textContent='Add a title.';return}}
  $('#ferr').textContent='';
  try{
    if(fFile){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);r.pdfN=await store.putPdf(id,await b64(fFile));r.pdfId=id;r.pdfName=fFile.name}
    else if(fOld&&!fRemove){r.pdfId=fOld.id;r.pdfN=fOld.n;r.pdfName=fOld.name}
    await store.save(r);
    if(fOld&&(fFile||fRemove))await store.delPdf(fOld.id,fOld.n);
    closeSheet()}catch(x){alert('Could not save. Check that you are signed in as an admin and the file is under 1 MB.')}};

(async()=>{
  try{store=FB.apiKey?await fbStore():demoStore()}catch(e){store=demoStore()}
  store.onUser(u=>{user=u;rFT();rTT();rEX();rAS()});
  store.onList(l=>{A=l;loaded=true;rAS()});
  store.onExams(l=>{X=l;rTT();rEX();tick()});
  store.onOv(o=>{OV={can:o.can||[],hol:o.hol||[],exSeeded:!!o.exSeeded};rTT();rEX();tick()});
  rFT();rTT();rEX();rAS();rBatch();if(!batch)openBatch();setInterval(tick,1000)})();
