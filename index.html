    del:id=>{L=L.filter(x=>x.id!==id);sv('A',L);la(L)},onOv:cb=>{lo=cb;cb(O)},setOv:o=>{O=o;sv('O',o);lo(O)},putPdf:async(id,b)=>{localStorage.setItem('P'+id,b);return 1},getPdf:async id=>localStorage.getItem('P'+id)||'',delPdf:async id=>{try{localStorage.removeItem('P'+id)}catch(e){}}}}
async function fbStore(){
  const b='https://www.gstatic.com/firebasejs/10.12.2/';
  const[{initializeApp},Au,F]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
  const app=initializeApp(FB),auth=Au.getAuth(app),db=F.getFirestore(app);
  return{onUser:cb=>Au.onAuthStateChanged(auth,u=>cb(u&&u.email)),signIn:()=>Au.signInWithPopup(auth,new Au.GoogleAuthProvider()),signOut:()=>Au.signOut(auth),
    onList:cb=>F.onSnapshot(F.collection(db,'assignments'),s=>cb(s.docs.map(d=>({...d.data(),id:d.id})))),
    save:a=>{const{id,...r}=a;return id?F.setDoc(F.doc(db,'assignments',id),r):F.addDoc(F.collection(db,'assignments'),r)},
    del:id=>F.deleteDoc(F.doc(db,'assignments',id)),
    onOv:cb=>F.onSnapshot(F.doc(db,'settings','overrides'),s=>cb(s.data()||{})),setOv:o=>F.setDoc(F.doc(db,'settings','overrides'),o),
    putPdf:async(id,b)=>{const n=Math.ceil(b.length/7e5);for(let i=0;i<n;i++)await F.setDoc(F.doc(db,'pdfs',id+'_'+i),{d:b.slice(i*7e5,(i+1)*7e5)});return n},
    getPdf:async(id,n)=>{let t='';for(let i=0;i<n;i++)t+=(await F.getDoc(F.doc(db,'pdfs',id+'_'+i))).data().d;return t},
    delPdf:async(id,n)=>{for(let i=0;i<n;i++)await F.deleteDoc(F.doc(db,'pdfs',id+'_'+i))}}}

/* ---------- live "now" card ---------- */
function nextLec(n,m){for(let i=0;i<8;i++){const d=new Date(n);d.setDate(d.getDate()+i);const k=ds(d);if(hol(k))continue;const e=(T[d.getDay()]||[]).find(e=>e[2]!=='-'&&!canc(k,e)&&(i>0||mn(e[0])>m));if(e)return{e,i,d}}return null}
let hh='',U={};
function hero(){
  const n=now(),d=ds(n),m=n.getHours()*60+n.getMinutes(),sec=m*60+n.getSeconds(),L=T[n.getDay()]||[];
  const cur=L.find(e=>mn(e[0])<=m&&m<mn(e[1])),nx=nextLec(n,m),left=cur?Math.max(1,Math.ceil((mn(cur[1])*60-sec)/60)):0;
  let h='',live=false;U={};
  if(hol(d))h='<div class="lbl">Today</div><div class="ttl">Holiday</div><div class="sub">No lectures today. Enjoy.</div>';
  else if(cur&&cur[2]==='-'){U.r='Back in '+dur(left);h='<div class="lbl">Now</div><div class="ttl">Break</div><div class="sub" id="rem"></div>'}
  else if(cur&&canc(d,cur))h=`<div class="lbl">Now</div><div class="ttl">Lecture cancelled</div><div class="sub">${info(cur).t} was cancelled.</div>`;
  else if(cur){const i=info(cur);live=true;U.p=(sec-mn(cur[0])*60)/((mn(cur[1])-mn(cur[0]))*60)*100;U.r='Ends in '+dur(left);
    h=`<div class="lbl"><span class="dot"></span>Happening now</div><div class="ttl">${i.t}${cur[4]?' · '+cur[4]:''}</div><div class="sub">${rm(cur)} · ${f12(cur[0])} – ${f12(cur[1])}${i.f?'<br>'+i.f:''}</div><div class="pb"><i id="pbi"></i></div><div class="sub" id="rem"></div>`}
  else h='<div class="lbl">Now</div><div class="ttl">No lecture right now</div>';
  if(nx){const i=info(nx.e);let w;if(nx.i===0){U.n='in '+dur(mn(nx.e[0])-m);w=`${f12(nx.e[0])} · ${rm(nx.e)} · <span id="nxm"></span>`}else w=(nx.i===1?'Tomorrow':DN[nx.d.getDay()])+' at '+f12(nx.e[0]);
    h+=`<div class="nx">Up next<br><b>${i.t}${nx.e[4]?' · '+nx.e[4]:''}</b> · ${w}</div>`}
  const el=$('#hero');el.classList.toggle('idle',!live);if(h!==hh){hh=h;el.innerHTML=h}
  const p=$('#pbi');if(p)p.style.width=U.p+'%';const r=$('#rem');if(r)r.textContent=U.r;const x=$('#nxm');if(x)x.textContent=U.n}

/* ---------- full timetable ---------- */
function rTT(){
  const n=now(),td=n.getDay(),m=n.getHours()*60+n.getMinutes();if(tab===null)tab=td||1;
  $('#tabs').innerHTML=[1,2,3,4,5,6].map(i=>`<button class="tb${i===tab?' on':''}${i===td?' td':''}" data-t="${i}">${DN[i].slice(0,3)}</button>`).join('');
  const dt=dateFor(tab),k=ds(dt),H=hol(k),ad=isAdmin();
  let h=`<div class="rw"><div class="rb"><span>${dt.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}${H?' · Holiday':''}</span></div>${ad?`<button class="mini" data-h="${k}">${H?'Remove holiday':'Mark holiday'}</button>`:''}</div>`;
  h+=T[tab].map(e=>{
    if(e[2]==='-')return`<div class="rw brk"><div class="tm">${f12(e[0])}</div><div class="rb"><span>Break</span></div></div>`;
    const i=info(e),c=canc(k,e),cur=tab===td&&!H&&!c&&mn(e[0])<=m&&m<mn(e[1]);
    return`<div class="rw${cur?' cur':''}${c||H?' cx':''}" style="--h:${i.h}"><div class="tm">${f12(e[0])}<br>${f12(e[1])}</div><div class="bar"></div><div class="rb"><b>${i.t}${e[4]?' · '+e[4]:''}</b><span>${rm(e)}${i.f?' · '+i.f:''}</span></div>${c?'<span class="pill">Cancelled</span>':''}${ad&&!H?`<button class="mini" data-c="${k}|${e[0]}">${c?'Restore':'Cancel'}</button>`:''}</div>`}).join('');
  $('#tt').innerHTML=h}

/* ---------- assignments ---------- */
const gcal=a=>{const z=t=>new Date(t).toISOString().replace(/[-:]|\.\d{3}/g,'');return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(a.type+': '+a.title+' ('+a.subject+')')+'&dates='+z(a.due)+'/'+z(a.due+18e5)+'&details='+encodeURIComponent(a.notes||'')};
function rAS(){
  const t=Date.now(),dn=a=>done.includes(a.id),an=anim,g=x=>dn(x)?2:x.due<t?1:0;
  const L=A.filter(a=>filter==='all'||a.type===filter).sort((a,b)=>g(a)-g(b)||(g(a)===1?b.due-a.due:a.due-b.due));
  $('#as').innerHTML=L.length?L.map((a,i)=>`<div class="as${dn(a)?' dn':''}${an?' rise':''}" style="--h:${(S[a.subject]||{h:220}).h};--d:${i*.06}s"><button class="ck" data-d="${a.id}" aria-label="Mark done">✓</button><div class="ab"><div class="chips"><span class="ch">${esc(a.subject)}</span><span class="ch ty">${esc(a.type)}</span></div><div class="at">${esc(a.title)}</div><div class="dd">Due ${new Date(a.due).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</div>${dn(a)?'<span class="cd fin">Done</span>':`<span class="cd" data-due="${a.due}"></span>`}${a.notes?`<div class="nt" data-n="1">${esc(a.notes)}</div>`:''}<div class="ac">${a.pdfId?`<button class="mini" data-p="${a.id}">Open PDF</button>`:''}<a class="mini" target="_blank" rel="noopener" href="${gcal(a)}">Add to calendar</a>${isAdmin()?`<button class="mini" data-e="${a.id}">Edit</button>`:''}</div></div></div>`).join(''):'<div class="empty">Nothing here yet. You\'re all clear.</div>';
  if(loaded)anim=false;tick()}
function rFT(){
  $('#ft').innerHTML=(user?`${esc(user)} · ${isAdmin()?'Admin':'Not an admin'} <button id="so">Sign out</button>`:'<button id="si">Admin sign in</button>')+(isAdmin()?`<div style="margin-top:12px">Preview time <input type="time" id="pt" value="${demo||''}" style="width:auto;display:inline-block;padding:6px 8px"></div>`:'')+(store.demo?'<div style="margin-top:10px">Demo mode: data stays on this device.</div>':'');

/* ---------- loop ---------- */
function cd(due){const a=new Date(due),b=new Date();b.setHours(0,0,0,0);a.setHours(0,0,0,0);const n=Math.round((a-b)/864e5);return n===0?(due<Date.now()?'Overdue':'Due today'):n>0?n+(n===1?' day left':' days left'):'Overdue by '+(-n)+(n===-1?' day':' days')}
function tick(){
  const n=now();$('#clk').innerHTML=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'<br><span>'+n.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})+'</span>';
  hero();const t=Date.now();
  document.querySelectorAll('[data-due]').forEach(e=>{const ms=+e.dataset.due-t;e.textContent=cd(+e.dataset.due);e.className='cd'+(ms<0?' late':ms<864e5?' soon':'')});
  const mk=ds(n)+n.getHours()+':'+n.getMinutes();if(mk!==lastMin){lastMin=mk;rTT()}}

  if(q.h){const c=[...OV.hol],i=c.indexOf(q.h);i<0?c.push(q.h):c.splice(i,1);OV={...OV,hol:c};store.setOv(OV);rTT();tick()}};

const setType=()=>[...$('#ts').children].forEach(b=>b.classList.toggle('on',b.dataset.t===type));
$('#ts').onclick=e=>{if(e.target.dataset.t){type=e.target.dataset.t;setType()}};
const toLocal=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,16);
let fSub=SUBJ[0],fDate=null,fTime='23:59',calM=new Date();
const TM=[['09:00','9 AM'],['12:00','12 PM'],['17:00','5 PM'],['23:59','11:59 PM']];
const dueTs=()=>{const[h,m]=fTime.split(':');return new Date(fDate.getFullYear(),fDate.getMonth(),fDate.getDate(),+h,+m).getTime()};
function rSubj(){$('#sg').innerHTML=SUBJ.map(s=>`<button type="button" class="sc${s===fSub?' on':''}" style="--h:${(S[s]||{h:220}).h}" data-s="${s}"><i></i>${s}</button>`).join('')}
function rTimes(){const L=TM.some(x=>x[0]===fTime)?TM:[...TM,[fTime,f12(fTime)]];$('#tc').innerHTML=L.map(x=>`<button type="button" class="mini${x[0]===fTime?' sel':''}" data-tm="${x[0]}">${x[1]}</button>`).join('')}
function rCal(){const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),t0=new Date();t0.setHours(0,0,0,0);
  let h=`<div class="cm"><button type="button" data-m="-1">‹</button><span>${calM.toLocaleDateString([],{month:'long',year:'numeric'})}</span><button type="button" data-m="1">›</button></div><div class="cg">`+'SMTWTFS'.split('').map(x=>`<b>${x}</b>`).join('');
  for(let i=0;i<first;i++)h+='<span></span>';
  for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),on=fDate&&+dt===+fDate;h+=`<button type="button" data-day="${d}" class="${on?'on':''}${+dt===+t0?' td':''}"${dt<t0&&!edit?' disabled':''}>${d}</button>`}

/* WhatsApp message parser */
const AL={Maths:['maths?','mathematics'],Chemistry:['chem','chemistry'],PPS:['pps','programming'],IIKS:['iiks','iks','indian knowledge'],EM:['em','engineering mechanics','mechanics'],PS:['ps','ps-?i','practice session'],EW:['ew','elec ws','electrical workshop','workshop']};
const MA=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'],MR='(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
function parseWA(x){
  const c=x.replace(/^\[[^\]\n]*\][^:\n]*:\s*/gm,'').replace(/^\d{1,2}\/\d{1,2}\/\d{2,4},?\s*[\d:]+\s*(?:am|pm)?\s*-\s*[^:\n]*:\s*/gim,'').trim(),l=c.toLowerCase(),o={n:c};
  for(const s in AL)if(new RegExp('\\b('+AL[s].join('|')+')\\b').test(l)){o.s=s;break}
  o.t=/experiment|practical|\blab\b|journal|write-?up|viva/.test(l)?'Experiment':'Assignment';
  const t0=new Date();t0.setHours(0,0,0,0);let d=null,m;
  const fix=(dd,mm,yy)=>{if(mm<0||mm>11||dd<1||dd>31)return null;const y=yy?(+yy<100?2000+ +yy:+yy):t0.getFullYear();let r=new Date(y,mm,dd);if(!yy&&r<new Date(t0.getTime()-30*864e5))r=new Date(y+1,mm,dd);return r};
  if(m=l.match(new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?[\\s-]*'+MR+'\\b(?:[\\s,-]*(\\d{4}))?')))d=fix(+m[1],MA.indexOf(m[2].slice(0,3)),m[3]);
  else if(m=l.match(new RegExp('\\b'+MR+'\\s*(\\d{1,2})(?:st|nd|rd|th)?\\b')))d=fix(+m[2],MA.indexOf(m[1].slice(0,3)));
  else if(m=l.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/))d=fix(+m[1],+m[2]-1,m[3]);
  else if(/\btoday\b/.test(l))d=t0;
  else if(/\b(tomorrow|tmrw)\b/.test(l)){d=new Date(t0);d.setDate(d.getDate()+1)}
  else if(m=l.match(/\b(sun|mon|tues?|wed(?:nes)?|thu(?:rs?)?|fri|sat(?:ur)?)(?:day)?\b/)){d=new Date(t0);const k=(['sun','mon','tue','wed','thu','fri','sat'].indexOf(m[1].slice(0,3))-d.getDay()+7)%7;d.setDate(d.getDate()+(k||7))}
  o.d=d;
  if(m=l.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/))o.tm=String(+m[1]%12+(m[3]==='pm'?12:0)).padStart(2,'0')+':'+(m[2]||'00');
  o.title=(c.split('\n').find(s=>s.trim())||'').trim().slice(0,70);
  return o}
$('#wago').onclick=()=>{const r=parseWA($('#wat').value);if(!r.n){$('#wast').textContent='Paste a message first.';return}
  if(r.s)fSub=r.s;type=r.t;setType();if(r.d){fDate=r.d;calM=new Date(r.d.getFullYear(),r.d.getMonth(),1);$('#ferr').textContent=''}if(r.tm)fTime=r.tm;
  $('#fti').value=r.title;$('#fn').value=r.n;rSubj();rCal();rTimes();
  $('#wast').textContent='Filled'+(r.s?' · '+r.s:' · pick subject')+(r.d?' · '+r.d.toLocaleDateString([],{day:'numeric',month:'short'}):' · pick date')+'. Please check.'};
function openSheet(a){edit=a||null;$('#fh').textContent=a?'Edit item':'New item';type=a?a.type:'Assignment';setType();
  fSub=a?a.subject:SUBJ[0];const dd=a?new Date(a.due):null;fDate=dd?new Date(dd.getFullYear(),dd.getMonth(),dd.getDate()):null;fTime=dd?String(dd.getHours()).padStart(2,'0')+':'+String(dd.getMinutes()).padStart(2,'0'):'23:59';const cm=fDate||new Date();calM=new Date(cm.getFullYear(),cm.getMonth(),1);
  $('#fti').value=a?a.title:'';$('#fn').value=a?a.notes||'':'';fFile=null;fRemove=false;fOld=a&&a.pdfId?{id:a.pdfId,n:a.pdfN,name:a.pdfName}:null;rPdf();$('#wat').value='';$('#wast').textContent='';$('#ferr').textContent='';$('#wab').classList.remove('open');rSubj();rCal();rTimes();
  $('#fdl').hidden=!a;$('#fdl').textContent='Delete';$('#ov').classList.add('on');try{history.pushState({s:1},'');hist=true}catch(e){}}
let hist=false;
const closeSheet=()=>{$('#ov').classList.remove('on');if(hist){hist=false;try{history.back()}catch(e){}}};
addEventListener('popstate',()=>{$('#ov').classList.remove('on');hist=false});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let fFile=null,fRemove=false,fOld=null;const PB={};
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
function rPdf(){const nm=fFile?fFile.name:(fOld&&!fRemove?fOld.name:'');$('#pn').textContent=nm||'No file chosen';$('#px').hidden=!nm;$('#pk').textContent=nm?'Replace PDF':'Choose PDF'}
$('#pk').onclick=()=>$('#pdf').click();
$('#pdf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>1048576){$('#ferr').textContent='PDF is too large (max 1 MB). Compress it and try again.';return}$('#ferr').textContent='';fFile=f;rPdf()};
$('#px').onclick=()=>{fFile=null;fRemove=true;rPdf()};
async function openPdf(a,btn){
  if(PB[a.pdfId]){window.open(PB[a.pdfId],'_blank');return}
  const w=window.open('','_blank'),old=btn.textContent;btn.textContent='Loading...';
  try{const b=await store.getPdf(a.pdfId,a.pdfN),bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    PB[a.pdfId]=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));
    if(w){w.location.href=PB[a.pdfId];btn.textContent=old}else btn.textContent='Tap again to open'}
  catch(x){if(w)w.close();btn.textContent='Could not load'}}
$('#add').onclick=()=>openSheet();$('#fx').onclick=closeSheet;$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};
$('#fdl').onclick=async e=>{if(e.target.textContent==='Delete'){e.target.textContent='Tap again to confirm';return}
  try{await store.del(edit.id);if(edit.pdfId)await store.delPdf(edit.pdfId,edit.pdfN);closeSheet()}catch(x){alert('Could not delete. Are you signed in as an admin?')}};
$('#fm').onsubmit=async e=>{e.preventDefault();
  if(!fDate){$('#ferr').textContent='Pick a deadline date.';return}
  const r={type,subject:fSub,title:$('#fti').value.trim(),due:dueTs(),notes:$('#fn').value.trim()};if(edit)r.id=edit.id;
  try{
    if(fFile){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);r.pdfN=await store.putPdf(id,await b64(fFile));r.pdfId=id;r.pdfName=fFile.name}
    else if(fOld&&!fRemove){r.pdfId=fOld.id;r.pdfN=fOld.n;r.pdfName=fOld.name}
    await store.save(r);
    if(fOld&&(fFile||fRemove))await store.delPdf(fOld.id,fOld.n);
    closeSheet()}catch(x){alert('Could not save. Check that you are signed in as an admin and the PDF is under 1 MB.')}};

(async()=>{
  try{store=FB.apiKey?await fbStore():demoStore()}catch(e){store=demoStore()}
  store.onUser(u=>{user=u;rFT();rTT();rAS()});
  store.onList(l=>{A=l;loaded=true;rAS()});
  store.onOv(o=>{OV={can:o.can||[],hol:o.hol||[]};rTT();tick()});
  rFT();rTT();rAS();setInterval(tick,1000)})();
